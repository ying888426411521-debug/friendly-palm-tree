name: Build Windows exe

on:
  push:
    branches: [main, claude/cool-feynman-7m5dnr]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build NetWatch.exe
        run: pyinstaller --noconsole --onefile --name NetWatch --icon icon.ico netwatch.py

      - name: Check the exe on Windows (runs, config location, taskbar embedding)
        shell: pwsh
        run: ./ci/windows_check.ps1

      - name: Upload taskbar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskbar-screenshots
          path: ci-shots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: NetWatch-windows
          path: dist/NetWatch.exe

      - name: Publish to the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/NetWatch.exe \
            --target "$GITHUB_SHA" \
            --title "NetWatch (Windows)" \
            --notes "自动构建自 ${GITHUB_SHA::7}。下载 NetWatch.exe 双击运行即可，配置保存在 %APPDATA%\\NetWatch\\config.json。"
