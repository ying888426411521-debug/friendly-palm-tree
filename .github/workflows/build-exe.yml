name: Build Windows exe

on:
  push:
    branches: [main, claude/cool-feynman-7m5dnr]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build NetWatch.exe
        run: pyinstaller --noconsole --onefile --name NetWatch --icon icon.ico netwatch.py

      - name: Smoke test (exe starts and stays running)
        shell: pwsh
        run: |
          $p = Start-Process dist\NetWatch.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "NetWatch.exe exited early with code $($p.ExitCode)" }
          if (-not (Test-Path dist\config.json)) { throw "config.json was not created next to the exe" }
          Stop-Process -Id $p.Id -Force
          Get-Process NetWatch -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item dist\config.json
          Get-Item dist\NetWatch.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: NetWatch-windows
          path: dist/NetWatch.exe

      - name: Publish to the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/NetWatch.exe \
            --target "$GITHUB_SHA" \
            --title "NetWatch (Windows)" \
            --notes "自动构建自 ${GITHUB_SHA::7}。下载 NetWatch.exe 双击运行即可，配置文件 config.json 会生成在 exe 旁边。"
